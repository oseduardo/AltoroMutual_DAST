name: Veracode DAST Scan Submission

on:
  push:
    branches:
      - 'main'

jobs:

    Prepare:
        runs-on: ubuntu-latest
        steps:
            # Install Veracode CLI
            - name: Install Veracode CLI
              run: |
                curl -fsS -O https://tools.veracode.com/veracode-cli/install
                chmod +x ./install
                ./install
                ./veracode version

    VeracodeDAST:
        needs: Prepare
        runs-on: ubuntu-latest
        steps:
            # Executes DAST Scan submission
            - name: Veracode DAST Scan
              run: |
                echo "Submitting Veracode DAST Scan"
                ./veracode dynamic scan --webhook 4088954e-5c61-4714-a099-535825ed1074
